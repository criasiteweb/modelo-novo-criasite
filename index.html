<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brasa Burger | Hambúrguer artesanal na brasa</title>
<meta name="description" content="Peça pelo WhatsApp. Hambúrguer artesanal, entrega rápida. Aberto até 23h40.">
<meta name="theme-color" content="#e63022">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap"></noscript>
<link rel="stylesheet" href="assets/css/estilo.css">
<script type="module" src="assets/js/app.js" defer></script>
</head>
<body>
<div class="progresso" data-prog></div>
<header class="capa">
  <div class="capa__real" aria-hidden="true"></div>
  <div class="logo-circ" data-logo>BB</div>
  <div class="capa__in container">
    <span class="selo-aberto" data-horario>Aberto agora</span>
    <h1 data-nome>Brasa Burger</h1>
    <p class="capa__sub" data-frase>Hambúrguer artesanal na brasa.</p>
    <button class="capa__cta" data-cta>Ver cardápio <span aria-hidden="true">↓</span></button>
  </div>
</header>

<div class="barra">
  <div class="container">
    <div class="busca">
      <span aria-hidden="true">🔎</span>
      <input data-input type="search" placeholder="Buscar no cardápio" aria-label="Buscar no cardápio">
    </div>
    <nav class="cats" data-cats aria-label="Categorias"></nav>
  </div>
</div>

<main class="container" data-main></main>

<button class="carrinho-bar" data-bar aria-label="Ver carrinho e pedir no WhatsApp">
  <span><span class="qt" data-bar-qt>0</span> itens</span>
  <span>Pedir no WhatsApp</span>
  <span data-bar-tot>R$ 0,00</span>
</button>


<!-- Mascote animado -->
<button class="mascote" data-mascote aria-label="Falar com a gente">
  <span class="mascote__balao" data-balao>Bora pedir?</span>
  <svg class="mascote__svg" viewBox="0 0 120 120" width="88" height="88" aria-hidden="true">
    <ellipse cx="60" cy="110" rx="30" ry="6" fill="rgba(0,0,0,.18)"/>
    <g class="mascote__corpo">
      <!-- pão de cima -->
      <path d="M22 50 Q60 10 98 50 Z" fill="#e8a44b"/>
      <path d="M22 50 Q60 14 98 50" fill="#f0b968"/>
      <circle cx="46" cy="36" r="2.4" fill="#fff3e0"/><circle cx="62" cy="30" r="2.4" fill="#fff3e0"/>
      <circle cx="76" cy="37" r="2.4" fill="#fff3e0"/><circle cx="54" cy="42" r="2.2" fill="#fff3e0"/>
      <!-- recheio -->
      <rect x="22" y="50" width="76" height="8" rx="4" fill="#5fae4e"/>
      <rect x="20" y="57" width="80" height="10" rx="5" fill="#8a4a2b"/>
      <rect x="22" y="65" width="76" height="7" rx="3.5" fill="#f2c94c"/>
      <!-- pão de baixo -->
      <path d="M24 72 Q60 92 96 72 L96 74 Q60 96 24 74 Z" fill="#e8a44b"/>
      <!-- olhos -->
      <g class="mascote__olhos">
        <circle cx="50" cy="44" r="7" fill="#fff"/><circle cx="70" cy="44" r="7" fill="#fff"/>
        <circle class="pupila" cx="50" cy="45" r="3.2" fill="#1a1a1a"/>
        <circle class="pupila" cx="70" cy="45" r="3.2" fill="#1a1a1a"/>
      </g>
      <!-- bracinho que acena -->
      <g class="mascote__braco"><rect x="95" y="58" width="16" height="5" rx="2.5" fill="#8a4a2b"/>
        <circle cx="112" cy="60" r="5" fill="#f0b968"/></g>
    </g>
  </svg>
</button>

<dialog data-dlg></dialog>
<dialog data-cdlg></dialog>

<footer>
  <div class="container">
    <strong data-nome>Brasa Burger</strong> · Aberto até 23h40 · Entrega e retirada<br>
    Rua Exemplo, 100, Centro
    <div class="cred"><a href="https://criasite.site/cria-site-vitrine">Criado por Cria Site</a></div>
  </div>
</footer>
</body>
</html>
